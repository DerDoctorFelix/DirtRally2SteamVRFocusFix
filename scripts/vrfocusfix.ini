; VRFocusFix settings. This file is optional: without it the defaults below
; are used. Edit, save, and restart the game.

[VRFocusFix]
; How to handle SteamVR's "Steam menu opened/closed" events:
;   swap = (default) fix: the game pauses while the Steam menu is open and
;          resumes as soon as you close it
;   none = change nothing (the original bug: the game freezes when you close
;          the Steam menu)
;   drop = hide the events from the game (did NOT fix DiRT Rally 2.0 on
;          Steam Frame; kept for experiments with other games)
EventFix=swap

; 1 = write vrfocusfix.log next to the DLL (useful when reporting a problem)
Log=0
